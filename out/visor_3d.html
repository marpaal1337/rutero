<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montgó 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Mapa 3D a pantalla completa, panel de datos flotante y perfil de altura abajo. Mismo diseño que el artifact. */
  :root {
    --bg: #eef1ee; --panel: #f9faf8; --fg: #17231c; --mut: #5b6b61; --line: #d5ddd7; --accent: #2b6e3f;
    --rA: #e8590c; --rB: #1c7ed6; --rC: #9c36b5;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Barlow', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101713; --panel: #19231d; --fg: #e6eee8; --mut: #93a399; --line: #2c3a31; --accent: #6cc487;
      --rA: #ff8a3d; --rB: #5aa9f5; --rC: #c77ddc; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--body); overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; }

  #panel { position: absolute; z-index: 3; top: 12px; left: 16px; width: min(340px, calc(100% - 32px));
           max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 12px 14px 14px; box-shadow: 0 6px 24px #0003; }
  h1 { font: 700 26px/1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
  .sub { color: var(--mut); font-size: 12px; margin: 3px 0 10px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .more-btn { display: none; appearance: none; background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 3px 9px; font: 600 12px var(--body); cursor: pointer; }
  .more-btn::after { content: ' ▴'; }
  #panel.compact .more-btn::after { content: ' ▾'; }
  .more-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #panel.compact #more { display: none; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tab { appearance: none; cursor: pointer; text-align: left; padding: 6px 8px 7px; border-radius: 7px; color: var(--fg);
         background: transparent; border: 1px solid var(--line); border-top: 4px solid var(--c); font: inherit; min-width: 0; }
  .tab b { display: block; font: 700 18px/1.1 var(--display); letter-spacing: .03em; }
  .tab span { font: 500 11px var(--mono); color: var(--mut); }
  .tab[aria-pressed="true"] { background: var(--bg); border-color: var(--c); }
  .tab:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #name { font-size: 12px; color: var(--mut); margin: 9px 0 8px; min-height: 2.8em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 6px; margin: 0 0 12px; }
  .stats div { min-width: 0; }
  .stats dt { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
  .stats dd { margin: 0; font: 500 15px var(--mono); font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 6px; }
  .btn { flex: 1; cursor: pointer; padding: 8px 10px; border-radius: 7px; font: 600 13px var(--body); border: 1px solid var(--line);
         background: transparent; color: var(--fg); }
  .btn.main { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .btn.sat { margin-top: 6px; width: 100%; }

  .pin { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .pin i { display: block; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 4px #0008; background: var(--d); }
  .lbl { order: -1; margin-bottom: 3px; white-space: nowrap; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
         border-radius: 5px; padding: 2px 7px; font: 500 11px var(--mono); box-shadow: 0 2px 8px #0003; }

  .grp { margin: 0 0 12px; }
  .glabel { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
  .glabel output { font: 500 12px var(--mono); color: var(--fg); text-transform: none; letter-spacing: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--fg); padding: 6px 0; font: 600 13px var(--body); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #legend { margin-top: 7px; }
  #legend i { display: block; height: 8px; border-radius: 4px; }
  #legend div { display: flex; justify-content: space-between; font: 500 10px var(--mono); color: var(--mut); margin-top: 2px; }
  input[type=date] { width: 100%; margin-top: 6px; font: 12px var(--mono); color: var(--fg); background: transparent; border: 1px solid var(--line, currentColor); border-radius: 6px; padding: 3px 6px; color-scheme: light dark; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  #sunnfo { font-size: 11px; color: var(--mut); margin-top: 3px; }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  #prof { position: relative; flex: none; height: 190px; background: var(--panel); border-top: 1px solid var(--line); }
  #prof svg { width: 100%; height: 100%; display: block; touch-action: none; }
  #tip { position: absolute; top: 8px; pointer-events: none; transform: translateX(-50%); display: none; white-space: nowrap;
         background: var(--fg); color: var(--panel); padding: 3px 8px; border-radius: 5px; font: 500 12px var(--mono); z-index: 2; }
  .ax { font: 500 10px var(--mono); fill: var(--mut); }
  @media (max-width: 520px) {
    #panel { padding: 10px 12px 12px; }
    .more-btn { display: block; }
    .sub { margin-bottom: 8px; }
    .tabs { margin-bottom: 10px; }
    #prof { height: 150px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="map"></div>
    <section id="panel" aria-label="Rutas del Montgó">
      <div class="head"><h1>Montgó</h1><button class="more-btn" id="moreBtn" type="button" aria-expanded="true" aria-controls="more">Detalles</button></div>
      <p class="sub">Domingo 25 de octubre · salida desde Valencia</p>
      <div class="tabs" id="tabs"></div>
      <div id="more">
      <div id="name"></div>
      <dl class="stats" id="stats"></dl>
      <div class="grp">
        <div class="glabel"><span>Color del track</span></div>
        <div class="seg" id="cmode">
          <button type="button" data-m="route" aria-pressed="false">Ruta</button>
          <button type="button" data-m="slope" aria-pressed="true">Pendiente</button>
        </div>
        <div id="legend" hidden><i id="lgbar"></i><div><span>0</span><span>20</span><span>40</span><span>60 %</span></div></div>
      </div>
      <div class="grp">
        <div class="glabel"><label for="hour">Sol</label><output id="hourv" for="hour"></output></div>
        <input type="range" id="hour" min="5" max="22" step="0.0833" value="10">
        <input type="date" id="sundate" aria-label="Fecha del sol">
        <div id="sunnfo"></div>
      </div>
      <button class="btn sat" id="base" type="button">Mapa: satélite</button>
      </div>
      <div class="actions">
        <button class="btn main" id="fly" type="button">Sobrevuelo</button>
        <button class="btn" id="frame" type="button">Ver todo</button>
      </div>
    </section>
  </div>
  <div id="prof"><div id="tip"></div><div id="svgbox" style="height:100%"></div></div>
</div>

    const target = Math.atan2(q.lon - p.lon, q.lat - p.lat) * 180 / Math.PI;
    bearing += (((target - bearing + 540) % 360) - 180) * 0.03;
    map.jumpTo({ center: [p.lon, p.lat], bearing, pitch: 68, zoom: 15.2 });
    showAt(d);
    if (f < 1) flying.raf = requestAnimationFrame(step); else stopFly();
  };
  flying = { raf: requestAnimationFrame(step) };
});
map.on('mousedown', () => { if (flying) stopFly(); });
map.on('touchstart', () => { if (flying) stopFly(); });
$('frame').addEventListener('click', () => { stopFly(); frameAll(1200); });


$('lgbar').style.background = LEGEND_CSS;
let cmode = 'slope';
$('cmode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { cmode = b.dataset.m; applyColor(); } });

function applyColor() {
  KEYS.forEach(j => {
    const l = 'line-' + j;
    if (!map.getLayer(l)) return;
    if (cmode === 'slope' && j === cur) {
      const r = ROUTES[j], N = 120, st = [];
      for (let i = 0; i <= N; i++) st.push(i / N, slopeHex(slopeAtDist(r, i / N * r.total)));
      map.setPaintProperty(l, 'line-gradient', ['interpolate', ['linear'], ['line-progress'], ...st]);
    } else map.setPaintProperty(l, 'line-gradient', null);
  });
  $('legend').hidden = cmode !== 'slope';
  document.querySelectorAll('#cmode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === cmode));
}

/* ---- sol: dirección e intensidad del sombreado del relieve y brillo del mapa ---- */
function setSun(h) {
  const s = sunPos(h), k = Math.min(Math.max((s.el + 3) / 10, 0), 1);
  $('hourv').textContent = fmtClock(h); $('sunnfo').textContent = sunInfo(h);
  if (!map.getLayer('hill')) return;
  map.setPaintProperty('hill', 'hillshade-illumination-anchor', 'map');
  map.setPaintProperty('hill', 'hillshade-illumination-direction', s.az);
  map.setPaintProperty('hill', 'hillshade-exaggeration', 0.9 - 0.55 * Math.min(Math.max(s.el, 0), 45) / 45);
  ['sat', 'topo'].forEach(l => map.setPaintProperty(l, 'raster-brightness-max', 0.3 + 0.7 * k));
}
$('hour').addEventListener('input', e => setSun(+e.target.value));
const pad2 = n => String(n).padStart(2, '0'), today = new Date();
$('sundate').value = `${today.getFullYear()}-${pad2(today.getMonth() + 1)}-${pad2(today.getDate())}`;   // por defecto: hoy
function setSunDate() {
  const [y, m, d] = $('sundate').value.split('-').map(Number);
  if (!y) return;
  setSunLocation(SUN.lat, SUN.lon, new Date(y, m - 1, d)); setSun(+$('hour').value);
}
$('sundate').addEventListener('change', setSunDate);
setSunLocation(SUN.lat, SUN.lon);
$('hourv').textContent = fmtClock(10); $('sunnfo').textContent = sunInfo(10);

/* ---- mapa base y tema ---- */
let sat = true;
$('base').addEventListener('click', e => {
  sat = !sat;
  map.setLayoutProperty('sat', 'visibility', sat ? 'visible' : 'none');
  map.setLayoutProperty('topo', 'visibility', sat ? 'none' : 'visible');
  e.target.textContent = 'Mapa: ' + (sat ? 'satélite' : 'topográfico');
});
function applyTheme() {
  if (!map.getLayer('line-A')) return;
  KEYS.forEach(k => map.setPaintProperty('line-' + k, 'line-color', routeColor(k)));
  if (hoverMk) hoverMk.getElement().firstChild.style.setProperty('--d', routeColor(cur));
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
</script>
