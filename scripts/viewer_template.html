<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Montgó 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  /* Mapa 3D a pantalla completa, panel de datos flotante y perfil de altura abajo. Mismo diseño que el artifact. */
  :root {
    --bg: #eef1ee; --panel: #f9faf8; --fg: #17231c; --mut: #5b6b61; --line: #d5ddd7; --accent: #2b6e3f;
    --rA: #e8590c; --rB: #1c7ed6; --rC: #9c36b5;
    --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --body: 'Barlow', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101713; --panel: #19231d; --fg: #e6eee8; --mut: #93a399; --line: #2c3a31; --accent: #6cc487;
      --rA: #ff8a3d; --rB: #5aa9f5; --rC: #c77ddc; color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--fg); font: 14px/1.4 var(--body); overflow: hidden; }
  #app { height: 100%; display: flex; flex-direction: column; }
  #stage { position: relative; flex: 1; min-height: 0; }
  #map { position: absolute; inset: 0; }

  #panel { position: absolute; z-index: 3; top: 12px; left: 16px; width: min(340px, calc(100% - 32px));
           max-height: calc(100% - 24px); overflow: auto; background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; padding: 12px 14px 14px; box-shadow: 0 6px 24px #0003; }
  h1 { font: 700 26px/1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
  .sub { color: var(--mut); font-size: 12px; margin: 3px 0 10px; }
  .head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .more-btn { display: none; appearance: none; background: transparent; border: 1px solid var(--line); color: var(--fg); border-radius: 6px; padding: 3px 9px; font: 600 12px var(--body); cursor: pointer; }
  .more-btn::after { content: ' ▴'; }
  #panel.compact .more-btn::after { content: ' ▾'; }
  .more-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #panel.compact #more { display: none; }
  .tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .tab { appearance: none; cursor: pointer; text-align: left; padding: 6px 8px 7px; border-radius: 7px; color: var(--fg);
         background: transparent; border: 1px solid var(--line); border-top: 4px solid var(--c); font: inherit; min-width: 0; }
  .tab b { display: block; font: 700 18px/1.1 var(--display); letter-spacing: .03em; }
  .tab span { font: 500 11px var(--mono); color: var(--mut); }
  .tab[aria-pressed="true"] { background: var(--bg); border-color: var(--c); }
  .tab:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #name { font-size: 12px; color: var(--mut); margin: 9px 0 8px; min-height: 2.8em; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 6px; margin: 0 0 12px; }
  .stats div { min-width: 0; }
  .stats dt { font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; }
  .stats dd { margin: 0; font: 500 15px var(--mono); font-variant-numeric: tabular-nums; }
  .actions { display: flex; gap: 6px; }
  .btn { flex: 1; cursor: pointer; padding: 8px 10px; border-radius: 7px; font: 600 13px var(--body); border: 1px solid var(--line);
         background: transparent; color: var(--fg); }
  .btn.main { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .btn.sat { margin-top: 6px; width: 100%; }

  .pin { display: flex; flex-direction: column; align-items: center; pointer-events: none; }
  .pin i { display: block; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 4px #0008; background: var(--d); }
  .lbl { order: -1; margin-bottom: 3px; white-space: nowrap; background: var(--panel); color: var(--fg); border: 1px solid var(--line);
         border-radius: 5px; padding: 2px 7px; font: 500 11px var(--mono); box-shadow: 0 2px 8px #0003; }

  .grp { margin: 0 0 12px; }
  .glabel { display: flex; justify-content: space-between; align-items: baseline; font-size: 11px; color: var(--mut); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 5px; }
  .glabel output { font: 500 12px var(--mono); color: var(--fg); text-transform: none; letter-spacing: 0; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { appearance: none; border: 0; background: transparent; color: var(--fg); padding: 6px 0; font: 600 13px var(--body); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  #legend { margin-top: 7px; }
  #legend i { display: block; height: 8px; border-radius: 4px; }
  #legend div { display: flex; justify-content: space-between; font: 500 10px var(--mono); color: var(--mut); margin-top: 2px; }
  input[type=date] { width: 100%; margin-top: 6px; font: 12px var(--mono); color: var(--fg); background: transparent; border: 1px solid var(--line, currentColor); border-radius: 6px; padding: 3px 6px; color-scheme: light dark; }
  input[type=range] { width: 100%; margin: 0; accent-color: var(--accent); }
  #sunnfo { font-size: 11px; color: var(--mut); margin-top: 3px; }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  #prof { position: relative; flex: none; height: 190px; background: var(--panel); border-top: 1px solid var(--line); }
  #prof svg { width: 100%; height: 100%; display: block; touch-action: none; }
  #tip { position: absolute; top: 8px; pointer-events: none; transform: translateX(-50%); display: none; white-space: nowrap;
         background: var(--fg); color: var(--panel); padding: 3px 8px; border-radius: 5px; font: 500 12px var(--mono); z-index: 2; }
  .ax { font: 500 10px var(--mono); fill: var(--mut); }
  @media (max-width: 520px) {
    #panel { padding: 10px 12px 12px; }
    .more-btn { display: block; }
    .sub { margin-bottom: 8px; }
    .tabs { margin-bottom: 10px; }
    #prof { height: 150px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="map"></div>
    <section id="panel" aria-label="Rutas del Montgó">
      <div class="head"><h1>Montgó</h1><button class="more-btn" id="moreBtn" type="button" aria-expanded="true" aria-controls="more">Detalles</button></div>
      <p class="sub">Domingo 25 de octubre · salida desde Valencia</p>
      <div class="tabs" id="tabs"></div>
      <div id="more">
      <div id="name"></div>
      <dl class="stats" id="stats"></dl>
      <div class="grp">
        <div class="glabel"><span>Color del track</span></div>
        <div class="seg" id="cmode">
          <button type="button" data-m="route" aria-pressed="false">Ruta</button>
          <button type="button" data-m="slope" aria-pressed="true">Pendiente</button>
        </div>
        <div id="legend" hidden><i id="lgbar"></i><div><span>0</span><span>20</span><span>40</span><span>60 %</span></div></div>
      </div>
      <div class="grp">
        <div class="glabel"><label for="hour">Sol</label><output id="hourv" for="hour"></output></div>
        <input type="range" id="hour" min="5" max="22" step="0.0833" value="10">
        <input type="date" id="sundate" aria-label="Fecha del sol">
        <div id="sunnfo"></div>
      </div>
      <button class="btn sat" id="base" type="button">Mapa: satélite</button>
      </div>
      <div class="actions">
        <button class="btn main" id="fly" type="button">Sobrevuelo</button>
        <button class="btn" id="frame" type="button">Ver todo</button>
      </div>
    </section>
  </div>
  <div id="prof"><div id="tip"></div><div id="svgbox" style="height:100%"></div></div>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
const ROUTES = /*ROUTES*/null;
/*SHARED*/
const KEYS = Object.keys(ROUTES).sort();
const $ = id => document.getElementById(id);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const routeColor = k => css('--r' + k);
const fmtH = h => Math.floor(h) + ' h ' + String(Math.round((h % 1) * 60)).padStart(2, '0');
KEYS.forEach(k => { const r = ROUTES[k]; r.total = r.dist[r.dist.length - 1]; });

const map = new maplibregl.Map({
  container: 'map', center: [0.115, 38.81], zoom: 12, pitch: 60, bearing: -20, maxPitch: 85,
  style: { version: 8, sources: {
    sat: { type: 'raster', tileSize: 256, maxzoom: 19, attribution: 'Esri World Imagery',
           tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'] },
    topo: { type: 'raster', tileSize: 256, maxzoom: 17, attribution: '© OpenTopoMap (CC-BY-SA), © OpenStreetMap',
            tiles: ['https://a.tile.opentopomap.org/{z}/{x}/{y}.png', 'https://b.tile.opentopomap.org/{z}/{x}/{y}.png'] },
    dem: { type: 'raster-dem', encoding: 'terrarium', tileSize: 256, maxzoom: 15, attribution: 'AWS Terrain Tiles',
           tiles: ['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'] }
  }, layers: [
    { id: 'sat', type: 'raster', source: 'sat' },
    { id: 'topo', type: 'raster', source: 'topo', layout: { visibility: 'none' } },
    { id: 'hill', type: 'hillshade', source: 'dem', paint: { 'hillshade-exaggeration': 0.25 } }
  ] }
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }));

let cur = 'A', markers = [], hoverMk = null, flying = null;
const geo = k => ({ type: 'Feature', geometry: { type: 'LineString', coordinates: ROUTES[k].pts } });

function pin(color, label) {
  const el = document.createElement('div'); el.className = 'pin';
  if (label) { const l = document.createElement('span'); l.className = 'lbl'; l.textContent = label; el.appendChild(l); }
  const d = document.createElement('i'); d.style.setProperty('--d', color); el.appendChild(d);
  return el;
}

function frameAll(duration) {
  const all = new maplibregl.LngLatBounds();
  KEYS.forEach(k => ROUTES[k].pts.forEach(p => all.extend([p[0], p[1]])));
  const narrow = innerWidth <= 520, pad = narrow ? { top: $('panel').offsetHeight + 24, bottom: 30, left: 24, right: 24 }
                                                  : { top: 60, bottom: 60, left: 400, right: 60 };
  map.fitBounds(all, { padding: pad, pitch: 60, bearing: -20, duration });
}

map.on('style.load', () => {
  map.setTerrain({ source: 'dem', exaggeration: 1 });
  KEYS.forEach(k => {
    map.addSource('trk-' + k, { type: 'geojson', data: geo(k), lineMetrics: true });
    map.addLayer({ id: 'case-' + k, type: 'line', source: 'trk-' + k, layout: { 'line-cap': 'round', 'line-join': 'round' },
                   paint: { 'line-color': '#fff', 'line-width': 7 } });
    map.addLayer({ id: 'line-' + k, type: 'line', source: 'trk-' + k, layout: { 'line-cap': 'round', 'line-join': 'round' },
                   paint: { 'line-color': routeColor(k), 'line-width': 4 } });
  });
  select('A');
  setSun(+$('hour').value);
  frameAll(0);
});

function select(k) {
  stopFly(); cur = k;
  const r = ROUTES[k];
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.k === k));
  $('name').textContent = r.name;
  $('stats').innerHTML = [
    ['Distancia', String(r.km).replace('.', ',') + ' km'], ['Desnivel', '+' + r.up + ' m'], ['Alt. máx', r.zmax + ' m'],
    ['Subida', fmtH(r.t_up)], ['Bajada', fmtH(r.t_dn)], ['Pend. máx', r.maxslope + ' %']
  ].map(([l, v]) => `<div><dt>${l}</dt><dd>${v}</dd></div>`).join('');
  if (map.getLayer('line-' + k)) {
    KEYS.forEach(j => {
      const on = j === k;
      map.setPaintProperty('line-' + j, 'line-width', on ? 5.5 : 3);
      map.setPaintProperty('line-' + j, 'line-opacity', on ? 1 : 0.75);
      map.setPaintProperty('case-' + j, 'line-width', on ? 9 : 5);
      map.setPaintProperty('case-' + j, 'line-opacity', on ? 1 : 0.6);
    });
    map.moveLayer('case-' + k); map.moveLayer('line-' + k);
    applyColor();
  }
  markers.forEach(m => m.remove()); markers = [];
  r.wpts.forEach(w => {
    const start = w.name.startsWith('Inicio');
    const label = (start ? 'Salida' : w.name.startsWith('Cumbre') ? 'Cumbre' : w.name.split(' (')[0]) + ' · ' + Math.round(w.ele) + ' m';
    markers.push(new maplibregl.Marker({ element: pin(start ? '#2f9e44' : '#e03131', label), anchor: 'bottom' })
      .setLngLat([w.lon, w.lat]).addTo(map));
  });
  if (hoverMk) hoverMk.remove();
  const h = pin(routeColor(k));
  hoverMk = new maplibregl.Marker({ element: h }).setLngLat([r.pts[0][0], r.pts[0][1]]);
  drawProfile();
}

$('tabs').innerHTML = KEYS.map(k => `<button class="tab" type="button" data-k="${k}" style="--c:var(--r${k})" aria-pressed="false"><b>Ruta ${k}</b><span>${String(ROUTES[k].km).replace('.', ',')} km</span></button>`).join('');
$('moreBtn').addEventListener('click', () => {
  const c = $('panel').classList.toggle('compact');
  $('moreBtn').setAttribute('aria-expanded', !c);
});
if (matchMedia('(max-width: 520px)').matches) { $('panel').classList.add('compact'); $('moreBtn').setAttribute('aria-expanded', 'false'); }
$('tabs').addEventListener('click', e => { const b = e.target.closest('.tab'); if (b) select(b.dataset.k); });

/* ---- perfil de elevación ---- */
const prof = $('prof'), tip = $('tip'), box = $('svgbox');
const M = { l: 44, r: 16, t: 14, b: 22 };
let P = null;
function drawProfile() {
  const w = box.clientWidth, h = box.clientHeight;
  if (!w || !h) return;
  const all = Object.values(ROUTES), KM = Math.max(...all.map(r => r.total));
  const zs = all.flatMap(r => r.pts.map(p => p[2]));
  const zmin = Math.floor(Math.min(...zs) / 100) * 100, zmax = Math.ceil(Math.max(...zs) / 100) * 100;
  const x = d => M.l + d / KM * (w - M.l - M.r), y = z => M.t + (1 - (z - zmin) / (zmax - zmin)) * (h - M.t - M.b);
  const line = r => r.pts.map((p, i) => `${i ? 'L' : 'M'}${x(r.dist[i]).toFixed(1)},${y(p[2]).toFixed(1)}`).join('');
  let g = '';
  for (let z = zmin; z <= zmax; z += 100) g += `<line x1="${M.l}" x2="${w - M.r}" y1="${y(z)}" y2="${y(z)}" stroke="var(--line)"/><text class="ax" x="${M.l - 6}" y="${y(z) + 3}" text-anchor="end">${z}</text>`;
  for (let d = 0; d <= KM; d += 1) g += `<text class="ax" x="${x(d)}" y="${h - 6}" text-anchor="middle">${d} km</text>`;
  const order = KEYS.filter(k => k !== cur).concat(cur);
  const paths = order.map(k => {
    const r = ROUTES[k], on = k === cur, c = `var(--r${k})`;
    return (on ? `<path d="${line(r)}L${x(r.total)},${y(zmin)}L${x(0)},${y(zmin)}Z" fill="${c}" opacity=".18"/>` : '') +
      `<path d="${line(r)}" fill="none" stroke="${c}" stroke-width="${on ? 2.5 : 1.5}" opacity="${on ? 1 : .55}" stroke-linejoin="round"/>`;
  }).join('');
  box.innerHTML = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Perfil de elevación de las tres rutas">${g}${paths}
    <line id="cl" y1="${M.t}" y2="${h - M.b}" stroke="var(--fg)" stroke-dasharray="3 3" style="display:none"/>
    <circle id="cc" r="5" fill="var(--panel)" stroke="var(--r${cur})" stroke-width="3" style="display:none"/></svg>`;
  P = { x, y, KM, w };
}
function at(d) {
  const r = ROUTES[cur]; let i = 1;
  while (i < r.dist.length - 1 && r.dist[i] < d) i++;
  const t = (d - r.dist[i - 1]) / ((r.dist[i] - r.dist[i - 1]) || 1), a = r.pts[i - 1], b = r.pts[i];
  return { lon: a[0] + (b[0] - a[0]) * t, lat: a[1] + (b[1] - a[1]) * t, ele: a[2] + (b[2] - a[2]) * t,
           slope: (b[2] - a[2]) / (((r.dist[i] - r.dist[i - 1]) * 1000) || 1) * 100 };
}
function showAt(d) {
  const p = at(d), x = P.x(d), cl = $('cl'), cc = $('cc');
  if (cl) { cl.setAttribute('x1', x); cl.setAttribute('x2', x); cl.style.display = ''; }
  if (cc) { cc.setAttribute('cx', x); cc.setAttribute('cy', P.y(p.ele)); cc.style.display = ''; }
  hoverMk.setLngLat([p.lon, p.lat]).addTo(map);
  tip.style.display = 'block'; tip.style.left = Math.min(Math.max(x, 70), P.w - 70) + 'px';
  tip.textContent = `${d.toFixed(2).replace('.', ',')} km · ${Math.round(p.ele)} m · ${Math.round(p.slope)} %`;
}
function hideAt() {
  tip.style.display = 'none';
  ['cl', 'cc'].forEach(id => { const e = $(id); if (e) e.style.display = 'none'; });
  if (hoverMk) hoverMk.remove();
}
function onMove(e) {
  if (flying || !P) return;
  const rect = box.getBoundingClientRect(), d = (e.clientX - rect.left - M.l) / (P.w - M.l - M.r) * P.KM;
  if (d >= 0 && d <= ROUTES[cur].total) showAt(d); else hideAt();
}
box.addEventListener('pointermove', onMove);
box.addEventListener('pointerdown', onMove);
box.addEventListener('pointerleave', () => { if (!flying) hideAt(); });
new ResizeObserver(drawProfile).observe(box);

/* ---- sobrevuelo ---- */
const flyBtn = $('fly');
function stopFly() { if (flying) cancelAnimationFrame(flying.raf); flying = null; flyBtn.textContent = 'Sobrevuelo'; hideAt(); }
flyBtn.addEventListener('click', () => {
  if (flying) return stopFly();
  const total = ROUTES[cur].total, dur = 45000;
  flyBtn.textContent = 'Parar'; let t0 = null, bearing = map.getBearing();
  const step = ts => {
    if (t0 === null) t0 = ts;
    const f = Math.min((ts - t0) / dur, 1), d = f * total, p = at(d), q = at(Math.min(d + 0.25, total));
    const target = Math.atan2(q.lon - p.lon, q.lat - p.lat) * 180 / Math.PI;
    bearing += (((target - bearing + 540) % 360) - 180) * 0.03;
    map.jumpTo({ center: [p.lon, p.lat], bearing, pitch: 68, zoom: 15.2 });
    showAt(d);
    if (f < 1) flying.raf = requestAnimationFrame(step); else stopFly();
  };
  flying = { raf: requestAnimationFrame(step) };
});
map.on('mousedown', () => { if (flying) stopFly(); });
map.on('touchstart', () => { if (flying) stopFly(); });
$('frame').addEventListener('click', () => { stopFly(); frameAll(1200); });


$('lgbar').style.background = LEGEND_CSS;
let cmode = 'slope';
$('cmode').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { cmode = b.dataset.m; applyColor(); } });

function applyColor() {
  KEYS.forEach(j => {
    const l = 'line-' + j;
    if (!map.getLayer(l)) return;
    if (cmode === 'slope' && j === cur) {
      const r = ROUTES[j], N = 120, st = [];
      for (let i = 0; i <= N; i++) st.push(i / N, slopeHex(slopeAtDist(r, i / N * r.total)));
      map.setPaintProperty(l, 'line-gradient', ['interpolate', ['linear'], ['line-progress'], ...st]);
    } else map.setPaintProperty(l, 'line-gradient', null);
  });
  $('legend').hidden = cmode !== 'slope';
  document.querySelectorAll('#cmode button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === cmode));
}

/* ---- sol: dirección e intensidad del sombreado del relieve y brillo del mapa ---- */
function setSun(h) {
  const s = sunPos(h), k = Math.min(Math.max((s.el + 3) / 10, 0), 1);
  $('hourv').textContent = fmtClock(h); $('sunnfo').textContent = sunInfo(h);
  if (!map.getLayer('hill')) return;
  map.setPaintProperty('hill', 'hillshade-illumination-anchor', 'map');
  map.setPaintProperty('hill', 'hillshade-illumination-direction', s.az);
  map.setPaintProperty('hill', 'hillshade-exaggeration', 0.9 - 0.55 * Math.min(Math.max(s.el, 0), 45) / 45);
  ['sat', 'topo'].forEach(l => map.setPaintProperty(l, 'raster-brightness-max', 0.3 + 0.7 * k));
}
$('hour').addEventListener('input', e => setSun(+e.target.value));
const pad2 = n => String(n).padStart(2, '0'), today = new Date();
$('sundate').value = `${today.getFullYear()}-${pad2(today.getMonth() + 1)}-${pad2(today.getDate())}`;   // por defecto: hoy
function setSunDate() {
  const [y, m, d] = $('sundate').value.split('-').map(Number);
  if (!y) return;
  setSunLocation(SUN.lat, SUN.lon, new Date(y, m - 1, d)); setSun(+$('hour').value);
}
$('sundate').addEventListener('change', setSunDate);
setSunLocation(SUN.lat, SUN.lon);
$('hourv').textContent = fmtClock(10); $('sunnfo').textContent = sunInfo(10);

/* ---- mapa base y tema ---- */
let sat = true;
$('base').addEventListener('click', e => {
  sat = !sat;
  map.setLayoutProperty('sat', 'visibility', sat ? 'visible' : 'none');
  map.setLayoutProperty('topo', 'visibility', sat ? 'none' : 'visible');
  e.target.textContent = 'Mapa: ' + (sat ? 'satélite' : 'topográfico');
});
function applyTheme() {
  if (!map.getLayer('line-A')) return;
  KEYS.forEach(k => map.setPaintProperty('line-' + k, 'line-color', routeColor(k)));
  if (hoverMk) hoverMk.getElement().firstChild.style.setProperty('--d', routeColor(cur));
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
</script>
